apply plugin: 'java'
apply plugin: 'eclipse'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

version = project.hasProperty('projectVersion') ? project.projectVersion : '2.0.0' // start with v2.0.0 to distinguish with other public forks
def title = 'JMeterInfluxDBListener'

jar {
    manifest {
        attributes 'Implementation-Title': title,
                   'Implementation-Version': version
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly group: 'org.apache.jmeter', name: 'ApacheJMeter_core', version: '5.6.3'
    compileOnly group: 'org.apache.jmeter', name: 'ApacheJMeter_components', version: '5.6.3'
    compileOnly group: 'org.apache.commons', name: 'commons-lang3', version: '3.12.0'
    implementation group: 'org.influxdb', name: 'influxdb-java', version: '2.23'
}

//create a single Jar with all dependencies
task fatJar(type: Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Implementation-Title': title,
                'Implementation-Version': version
    }
    archiveBaseName = project.name + '-plugin'
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}

wrapper {
    gradleVersion = '8.7'
}
